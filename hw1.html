<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background-color: grey;
        }

        .main-container {
            display: flex;
            gap: 12px;
            width: 1000px;
            width: 100%;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .box {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
        }

        .box1 {
            width: 200px;
            height: 400px;
        }

        .box2 {
            width: 400px;
            height: 200px;
        }

        .box3,
        .box4 {
            width: 250px;
            height: 200px;
        }

        .box5 {
            width: 510px;
            height: 190px;
        }

        .box6 {
            width: 310px;
            height: 200px;
        }

        .box7 {
            width: 300px;
            height: 400px;
        }

        .box8 {
            width: 300px;
            height: 200px;
        }

    </style>
</head>
<body>

    <div class="main-container">

    <div class="column">

        <div class="row">

            <div class="column">
                <div class="box box1"></div>
            </div>

            <div class="column">
                <div class="row">
                    <div class="box box3"></div>
                    <div class="box box4"></div>
                </div>

                <div class="box box5"></div>
            </div>

        </div>

        <div class="row">
            <div class="box box2"></div>
            <div class="box box6"></div>
        </div>

    </div>

    <div class="column">
        <div class="box box7"></div>
        <div class="box box8"></div>
    </div>

</div>

</body>
</html>
